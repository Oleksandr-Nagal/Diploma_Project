name: Mirror to GitLab

on:
  push:
    branches:
      - master

jobs:
  gitlab-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab "${{ secrets.GITLAB_REPO_URL }}"
          git push gitlab master --force
          git push gitlab --tags --force